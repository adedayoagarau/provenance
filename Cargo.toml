[package]
name = "provenance"
version = "0.1.0"
edition = "2021"
description = "Forensic authorship verification platform"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Crypto
sha2 = "0.10"

# NLP
rust-stemmers = "1.2"
unicode-segmentation = "1.10"

# Text Extraction — Document Formats
pulldown-cmark = "0.10"
lopdf = "0.32"
scraper = "0.18"
zip = "0.6"
rtf-parser = "0.3"
mailparse = "0.15"
regex = "1"

# Text Extraction — Encoding & Normalization
encoding_rs = "0.8"
unicode-normalization = "0.1"

# Numerical Computing
ndarray = "0.16"

# ML Pipeline (optional feature-gated dependencies)
linfa = { version = "0.7", optional = true }
linfa-svm = { version = "0.7", optional = true }
linfa-logistic = { version = "0.7", optional = true }
ort = { version = "2.0.0-rc.12", optional = true }

# Error Handling
thiserror = "1"
anyhow = "1"

# Config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
linfa = ["dep:linfa", "dep:linfa-svm", "dep:linfa-logistic"]
onnx = ["dep:ort"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "benchmarks"
harness = false
