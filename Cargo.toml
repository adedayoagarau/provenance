[package]
name = "provenance"
version = "0.1.0"
edition = "2021"
description = "Forensic authorship verification platform"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha2 = "0.10"

# NLP
rust-stemmers = "1.2"
unicode-segmentation = "1.10"

# Error Handling
thiserror = "1"
anyhow = "1"

# Config
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false
